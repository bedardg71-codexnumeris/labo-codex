# CodeQL — analyse statique de sécurité (SAST)
#
# Scan automatique du code JavaScript pour détecter vulnérabilités connues
# (XSS, path traversal, prototype pollution, etc.). Résultats publiés dans
# l'onglet Security → Code scanning du dépôt GitHub.
#
# Trigger : push sur main + PR vers main + scan hebdomadaire (filet de
# sécurité contre les nouvelles règles CodeQL publiées entre-temps).
#
# Référence : audit/PLAN-MOYEN-TERME.md §5.3 (OpenSSF Scorecard).

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Lundi 07:00 UTC = 03:00 Toronto (heure d'été) — hors heures de travail
    - cron: "0 7 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyse CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
