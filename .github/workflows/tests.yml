# Tests Vitest + Playwright (Défense I) en intégration continue
#
# Trigger : push sur main + toute pull request vers main — SAUF quand le commit
# ne touche que de la documentation (voir `paths-ignore` et son cliquet) : c'est
# la voie de VITEST. Depuis le 20 sept. 2026 (point 7), PLAYWRIGHT a la sienne :
# une fois par jour (`schedule`) et à la demande (`workflow_dispatch`).
# Runner : ubuntu-latest.
# Note : Playwright WebKit Linux ≠ Safari macOS — la validation device-
# spécifique (Safari Mac, iPad Air) reste manuelle locale par Grégoire.
#
# ⚠ ÉTAT DE CETTE CI AU 23 AOÛT 2026 — CE QUI EST MESURÉ, ET CE QUI NE L'EST PAS.
#
# (1) DEPUIS LE 21 AOÛT 16 H 21 UTC, LE JOB NE DÉMARRE PLUS. Vingt-six runs
#     d'affilée « échouent » en 3 à 5 secondes avec `runner_id: 0` et
#     `runner_name: ""` dans l'API, et aucune étape enregistrée : le job n'est
#     jamais dispatché. Le workflow, lui, est `state: active`, et aucun commit
#     n'a touché ce fichier ni `tests/package-lock.json` dans la fenêtre.
#
#     ⮕ CAUSE NON ÉTABLIE DEPUIS LE DÉPÔT. Cette signature est typiquement
#       celle de minutes Actions indisponibles sur un dépôt privé (quota du
#       mois épuisé, ou plafond de dépense atteint) — le dépôt est privé depuis
#       le 23 juin (cf. DEPLOY.md §8.3). Mais l'API ne le confirme pas : le
#       champ `billable` renvoie 0 pour TOUS les runs, y compris un run qui a
#       réellement tourné 868 s, il est donc inexploitable ici. À vérifier dans
#       Settings › Billing › Actions. AUCUN réglage de ce fichier ne peut
#       rétablir des minutes épuisées.
#
# (2) AVANT DE S'ARRÊTER, ELLE ÉTAIT DÉJÀ ROUGE. Dernier run complet, 18 août :
#     Vitest 2738/2738 vert, puis Playwright **88 passés, 5 échoués** en 12,5 min.
#     Les cinq sont des specs de glisser-déposer et de mise en page du
#     planificateur (planif-alignement, planif-drag-pointer-148 ×2,
#     planif-toolbar, portes-relais-cadre). La veille, le run 543 — une montée
#     de version de Playwright proposée par Dependabot — échouait déjà.
#     ⮕ Rétablir les minutes ne rendra pas la CI verte. Voir BACKLOG.
#
# (3) LE GASPILLAGE EST STRUCTUREL, ET C'EST CE QUE CE FICHIER PEUT CORRIGER.
#     Sur les 87 derniers runs : **61 annulés, 26 en échec, zéro succès**. Le
#     `cancel-in-progress` fauche la majorité des exécutions — Grégoire pousse
#     plus vite que les 12,5 min du job — et une bonne part de ces runs partait
#     sur des commits PUREMENT DOCUMENTAIRES.
#
# (4) 2 SEPTEMBRE 2026 — DEUX CAUSES MESURÉES, DEUX DÉCISIONS.
#     Une fois Vitest redevenu vert sous Node 20 (le bac à sable de #635 n'exposait
#     pas `navigator`, ed6aac3c), le job a atteint Playwright pour la première fois
#     depuis le 31 août — et s'est fait annuler par `timeout-minutes: 15` :
#     15 min 26 au total, ~3 min d'installation et de Vitest, puis 12,5 min de
#     Playwright pour 105 specs sur 239, 0 échec, `The operation was canceled`.
#     a) Le plafond datait d'une suite de 88-93 specs (point 2) ; elle en compte
#        239, à ~7 s l'une sur ce runner (2 s sur la machine de Grégoire).
#        ⮕ Plafond du job Playwright relevé à 40 : projection 239 × 7 s + 3 min
#        ≈ 31 min, plus un tiers de marge. PROJECTION depuis 105 specs, pas une
#        mesure : si un run réel la dépasse, on le dit, on ne remonte pas le
#        chiffre en boucle. Le plafond se déplace, il ne disparaît pas.
#     b) 239 essais en navigateur à chaque push, sur un compte dont le quota a
#        déjà été épuisé (point 1) : relever le plafond seul aurait fait passer
#        chaque push de code de 12,5 à ~31 min. Décision de Grégoire : « je ne
#        crois pas que 239 essais en navigateur doivent tourner à chaque push ».
#        ⮕ Le workflow devient DEUX jobs. `vitest` juge tout ce qui déclenche la
#        CI. `playwright` ne tourne que si le push touche quelque chose
#        d'OBSERVABLE AU NAVIGATEUR — la liste `OBSERVABLE` du job `vitest`, une
#        seule source, lue par le shell ET par le cliquet
#        (tests/unit/sentinelle-ci-paths-ignore.test.js, bloc 2). Un job sauté
#        est `skipped`, jamais `success` : le rituel d'ouverture (§2.1 du skill
#        debut-de-session) lit les JOBS, pas le run, et distingue jugé-vert,
#        jugé-rouge et NON JUGÉ. Écarté par Grégoire : les shards (ils
#        raccourcissent l'attente, pas la facture).
#
# (5) 2 SEPTEMBRE 2026, SOIR — SIX ESSAIS NE PEUVENT PAS JUGER SUR LINUX. Premier
#     verdict complet de Playwright sur GitHub depuis le 31 août, run 33671445284
#     (5f6eb365) : 233 passés, 6 échoués en 32 min 35, chacun rouge deux fois sur
#     deux. Cinq des six sont EXACTEMENT ceux du point (2), 18 août : glisser-
#     déposer et mise en page du planificateur sous WebKit Linux ≠ Safari macOS.
#     Les 239 passent sur la machine de Grégoire. Un rouge qui dure cesse d'être
#     un signal (c'est ce qui a produit « je ne vois pas de rouge »).
#     ⮕ Exclus PAR TITRE (les cinq fichiers portent 17 essais, onze restent jugés)
#     À L'ÉTAPE PLAYWRIGHT DE LA CI SEULEMENT (PW_EXCLURE_WEBKIT_LINUX=1, lue par
#     tests/playwright.config.js, liste EXCLUS_WEBKIT_LINUX) : sur macOS,
#     `npm run test:int` lance toujours les 239, sans rien à taper. L'étape qui
#     précède Playwright DIT le compte dans son nom, son log et son résumé, et
#     échoue si le nom ne correspond plus à la liste ; le cliquet (bloc 3) la
#     verrouille nommément. ⚠ CE À QUOI ON RENONCE : le planificateur n'est plus
#     jugé automatiquement nulle part ; son filet devient la passe locale sur
#     macOS. ⏳ Inscrit, pas réglé : personne n'a mesuré si ces gestes se
#     comportent vraiment autrement sous WebKit Linux, ou si les specs présument
#     une géométrie de macOS.
#
# (6) 20 SEPTEMBRE 2026 — LE PLAFOND DE 40 EST DÉPASSÉ PAR LA MESURE : 40 -> 60.
#     La projection du point (4a) annonçait « si un run réel la dépasse, on le
#     dit ». Mesuré sur les 60 derniers runs (15 au 20 sept., `gh run view
#     --json jobs`) : **29 jobs Playwright coupés au plafond** (40,2 à 40,8 min,
#     `The operation was canceled`, aucun push concurrent), dont trois le 20
#     (efa185c1, ee2669f9, a305f524), contre une dizaine qui concluent — entre
#     27,5 et 39,7 min. Un run coupé facture ses 40 minutes et n'achète aucun
#     verdict.
#     a) DEUX causes, mesurées, et aucune spec qui s'emballe. La suite est passée
#        de 239 à 379 essais (+59 %). Et le runner varie du simple au double :
#        ba6486a6 conclut 375 essais en 32,1 min (5,1 s l'un) ; a305f524, même
#        suite à 4 essais près, n'en a jugé que 276 en 39,3 min. Sur les 273
#        essais communs aux deux runs, le rapport des durées est de 1,60 —
#        médiane par fichier 1,60, minimum 1,21, maximum 2,65 ; les quinze plus
#        gros écarts ne pèsent que 17 % de l'écart total. Ralentissement
#        UNIFORME : c'est la machine, pas un essai.
#     b) Décision de Grégoire (20 sept.) : plafond à 60, et la durée réelle des
#        TROIS prochains runs complets s'inscrit ci-dessous avant de rediscuter
#        du chiffre. ⚠ PROJECTION, pas mesure : a305f524 mené à terme au même
#        rythme aurait pris ~54 min. Un runner lent FRÔLE donc déjà 60. La règle
#        du point (4a) tient toujours : si un run réel dépasse 60, on le dit à
#        Grégoire, on ne remonte pas le chiffre en boucle. Le plafond se
#        déplace sur une mesure, il ne disparaît pas. Toujours écartés : les
#        shards, les exclusions, les `retries`.
#     c) MESURES (durée du job Playwright · SHA · essais) — celles des trois
#        premiers runs planifiés ou demandés qui concluent (point 7).
#          1. —
#          2. —
#          3. —
#     d) Le job `vitest` (plafond 15) : 2,0 à 3,3 min sur ces 60 runs, pour
#        6884 essais. Loin du sien ; rien à changer.
#
# (7) 20 SEPTEMBRE 2026 — PLAYWRIGHT QUITTE LA VOIE DU PUSH : UNE FOIS PAR JOUR.
#     Question de Grégoire : « est-il nécessaire de faire les tests Playwright
#     sur toute l'application ? » Réponse retenue : OUI pour l'étendue — la suite
#     entière est la seule à voir une régression ailleurs que là où l'on vient de
#     corriger —, NON pour la fréquence. Rien n'est poussé sans avoir été jugé :
#     `scripts/pousser.sh` fait tourner la suite WebKit ENTIÈRE sur le Mac avant
#     chaque push de code, et le hook pre-push lance Vitest. Le run GitHub par
#     push payait donc un second verdict — cinq runs complets le 20 sept., dont
#     trois coupés au plafond.
#     a) `vitest` garde le `push` et la `pull_request`, tels quels. Il ne tourne
#        pas sur le `schedule` : le push l'a déjà jugé.
#     b) `playwright` ne part plus que par `schedule` — `cron: '0 8 * * *'`, soit
#        4 h à Toronto l'été. ⚠ Le cron de GitHub est en UTC et ne suit pas
#        l'heure avancée : de novembre à mars, ce sera 3 h. Connu, assumé. ⚠ Le
#        cron de GitHub part souvent en retard de plusieurs minutes, et GitHub
#        suspend les `schedule` d'un dépôt resté 60 jours sans activité — ou par
#        `workflow_dispatch` : la porte de sortie quand on veut un verdict tout
#        de suite (`gh workflow run tests.yml`).
#     c) LA GARDE D'INUTILITÉ (job `garde`, scripts/ci-garde-inutilite.sh) : un
#        run planifié s'arrête AVANT d'installer quoi que ce soit si rien
#        d'observable au navigateur n'a bougé depuis le dernier SHA qu'un run
#        planifié a jugé jusqu'au bout (`success` ou `failure` ; un run coupé ou
#        annulé ne compte pas, on rejuge). Dans le doute, on juge. Elle lit
#        l'historique des runs par `gh` avec le jeton du workflow : d'où
#        `actions: read` sur ce job, et lui seul. Playwright est alors `skipped`,
#        jamais `success` — la règle du point (4b) tient.
#     d) La liste `OBSERVABLE` RESTE, et monte au niveau du workflow. Elle ne
#        décide plus rien sur un push ; elle a trois lecteurs vivants :
#        scripts/lot-observable.sh (donc `pousser.sh` et le hook pre-push — le
#        verdict du Mac, #756), la garde du point c, et le cliquet (bloc 2).
#        RETIRÉS, faute de lecteur : l'étape « Décider si Playwright doit
#        tourner » et la sortie `outputs.playwright` du job `vitest`.
#     e) La concurrence se sépare par ÉVÉNEMENT : sans cela, le premier push du
#        matin (Grégoire travaille dès 4 h) annulerait le run planifié en cours.
#     f) Ce à quoi on renonce : le verdict GitHub au navigateur ne porte plus
#        sur le commit du push, mais sur le `main` de 4 h. Un écart entre le SHA
#        jugé et HEAD est NORMAL (rituel d'ouverture, §2.1).
#
# Deux leviers, dans l'ordre de poids :
#   1. `paths-ignore` — un commit qui ne touche que de la doc ne déclenche plus
#      rien. ⚠ La liste est VÉRIFIÉE par un cliquet
#      (tests/unit/sentinelle-ci-paths-ignore.test.js) : si un test se met un
#      jour à LIRE un fichier de ces dossiers, la sentinelle rougit — sans quoi
#      l'optimisation créerait un angle mort silencieux.
#   2. Cache du binaire WebKit — les dépendances système (apt) restent
#      réinstallées à chaque run, elles ne se cachent pas ; le navigateur, si.
#
# Référence : audit/PLAN-MOYEN-TERME.md §5.3 (OpenSSF Scorecard).

name: Tests

on:
  push:
    branches: [main]
    paths-ignore: &doc
      # ⚠ Toute entrée ajoutée ici doit l'être AUSSI dans le cliquet
      # tests/unit/sentinelle-ci-paths-ignore.test.js, qui vérifie qu'aucun
      # test ne lit ces chemins. `.claude/**` en est VOLONTAIREMENT absent :
      # sentinelle-skill-alignement.test.js lit `.claude/skills/alignement/SKILL.md`.
      - 'docs/**'
      - 'plans de travail/**'
      - 'Retours des testeurs/**'
      - 'Rapports/**'
      - 'AUDIT.md'
      - 'BACKLOG.md'
      - 'BACKLOG-ARCHIVE.md'
      - 'CLAUDE.md'
      - 'DEPLOY.md'
      - 'ETAT-PROJET.md'
      - 'FICHE-RELECTURE.md'
      - 'INCIDENTS.md'
      - 'INFO-ELEVES.md'
      - 'LICENSE.md'
      - 'NOTES-DE-VERSION.md'
      - 'OU-EN-EST-ON.md'
      - 'PRIVACY.md'
      - 'README.md'
      - 'RELAIS.md'
      - 'SECURITY.md'
      - 'SESSION.md'
  pull_request:
    branches: [main]
    paths-ignore: *doc
  # Point (7) : la voie de Playwright. UTC — 4 h à Toronto l'été, 3 h l'hiver.
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: read

# Par ÉVÉNEMENT (point 7e) : un push ne doit pas annuler le run planifié.
concurrency:
  group: tests-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  # ⚠ UNE SEULE SOURCE DE VÉRITÉ, trois lecteurs (point 7d) :
  # scripts/lot-observable.sh — donc `pousser.sh`, le hook pre-push et la garde
  # du job `garde` —, et le cliquet tests/unit/sentinelle-ci-paths-ignore
  # (bloc 2), qui vérifie qu'aucun spec Playwright ne LIT un chemin absent
  # d'ici. Une entrée finissant par `/` couvre le dossier ; sinon, c'est un
  # fichier exact. Playwright ouvre index.html en file:// : tout ce
  # qu'index.html charge est observable (js/, css/, icons/, styles.css,
  # version.js) ; s'y ajoutent ce que les specs lisent (version.json,
  # scripts/, tests/) et ce workflow lui-même, qui doit se juger.
  OBSERVABLE: "js/ css/ icons/ img/ libs/ index.html styles.css version.js version.json noms_stables.json scripts/ tests/ .github/workflows/tests.yml"

jobs:
  # ── Job 1 : Vitest, sur CHAQUE push et pull request (et à la demande). ──
  # Pas sur le `schedule` : le push l'a déjà jugé (point 7a).
  vitest:
    name: Vitest
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: tests/package-lock.json

      - name: Install dependencies
        working-directory: tests
        run: npm ci

      - name: Run unit tests (Vitest)
        working-directory: tests
        run: npm run test:unit

  # ── Job 2 : la garde d'inutilité (point 7c). Quelques secondes, rien d'installé. ──
  garde:
    name: Garde (Playwright doit-il tourner ?)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      juger: ${{ steps.garde.outputs.juger }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # L'historique complet : le diff doit pouvoir atteindre le dernier
          # SHA jugé, qui peut être plusieurs jours derrière.
          fetch-depth: 0

      - name: Rien d'observable n'a bougé ? Alors on ne paie pas la suite
        id: garde
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENEMENT: ${{ github.event_name }}
        run: |
          set -uo pipefail
          # Le dernier run planifié qui a CONCLU, celui-ci exclu. `gh` muet ou
          # en échec : DERNIER reste vide, et le script juge (dans le doute).
          DERNIER=$(gh run list --workflow tests.yml --event schedule --limit 30 \
            --json databaseId,headSha,conclusion \
            --jq '[.[] | select(.databaseId != ${{ github.run_id }}) | select(.conclusion == "success" or .conclusion == "failure")][0].headSha // ""' \
            2>/dev/null) || DERNIER=""
          export DERNIER
          IFS=$'\t' read -r juger raison < <(bash scripts/ci-garde-inutilite.sh)
          [ "$juger" = "non" ] || juger=oui
          echo "juger=$juger" >> "$GITHUB_OUTPUT"
          # Le texte de repli vit dans une variable : écrit dans `${raison:-…}`, son
          # apostrophe ouvrait une chaîne que bash ne refermait jamais (« unexpected
          # EOF », run planifié du 21 sept. 2026 : garde en échec, Vitest et
          # Playwright sautés).
          REPLI="la garde n'a rien rendu : on juge"
          {
            echo "## Playwright : ${juger^^}"
            echo ""
            echo "${raison:-$REPLI}"
            echo ""
            echo "Commit : \`${GITHUB_SHA:0:8}\` · dernier SHA jugé par un run planifié : \`${DERNIER:0:8}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Playwright : $juger — ${raison:-}"

  # ── Job 3 : Playwright, une fois par jour et à la demande — JAMAIS sur un push. ──
  # ⚠ Sauté = `skipped`, jamais `success`. C'est ce que le rituel d'ouverture lit.
  # Sur un push, `garde` est sauté, donc celui-ci aussi.
  playwright:
    name: Playwright (WebKit)
    needs: garde
    if: needs.garde.outputs.juger == 'oui'
    runs-on: ubuntu-latest
    # 2 sept. 2026 : 15 -> 40 (point 4a). 20 sept. 2026 : 40 -> 60 (point 6),
    # sur mesure — 29 jobs coupés à 40 min en six jours. Le plafond se DÉPLACE,
    # il ne disparaît pas : un job sans limite qui part en boucle consomme des
    # minutes jusqu'à épuisement.
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: tests/package-lock.json

      - name: Install dependencies
        working-directory: tests
        run: npm ci

      # Le binaire WebKit (~100 Mo) est identique tant que la version de
      # Playwright ne bouge pas : la clé du cache est donc le lock des tests.
      - name: Cache du navigateur WebKit
        id: cache-webkit
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-webkit-${{ runner.os }}-${{ hashFiles('tests/package-lock.json') }}

      # Les dépendances SYSTÈME (apt) ne se cachent pas utilement : elles
      # s'installent hors du workspace. On les repose à chaque run.
      - name: Dépendances système de WebKit
        working-directory: tests
        run: npx playwright install-deps webkit

      - name: Navigateur WebKit (seulement si absent du cache)
        if: steps.cache-webkit.outputs.cache-hit != 'true'
        working-directory: tests
        run: npx playwright install webkit

      # ⚠ LA GARDE DE CE LOT : un essai non jugé ne doit jamais ressembler à un
      # essai vert. Cette étape DIT, dans ce que le rituel d'ouverture lit (le nom
      # de l'étape, le log, le résumé), combien d'essais sont exclus ici et
      # pourquoi. Elle échoue si le nom ci-dessous ne correspond plus à la liste
      # (tests/playwright.config.js, EXCLUS_WEBKIT_LINUX) — même compte, même
      # source, vérifié aussi par le cliquet sentinelle-ci-paths-ignore (bloc 3).
      - name: "6 essais NON JUGÉS ici (5 specs, WebKit Linux ≠ Safari macOS)"
        working-directory: tests
        shell: bash
        run: |
          set -euo pipefail
          # ⚠ Les comptes sont calculés PAR NODE, pas par cut/sort : le premier
          # essai de cette étape passait sous bash sur macOS et échouait sur le
          # runner — `cut -d'›'` refuse un délimiteur multi-octet sous GNU
          # coreutils (run 33676985866, 2 sept.). Rien ici ne dépend de la
          # plateforme : node lit la liste, node compte.
          liste=$(node -e "import('./playwright.config.js').then(m => console.log(m.EXCLUS_WEBKIT_LINUX.map(e => e.fichier + ' - ' + e.titre).join('\n')))")
          read -r essais specs < <(node -e "import('./playwright.config.js').then(m => console.log(m.EXCLUS_WEBKIT_LINUX.length + ' ' + new Set(m.EXCLUS_WEBKIT_LINUX.map(e => e.fichier)).size))")
          echo "Essais NON JUGÉS sur cette plateforme : $essais ($specs specs) — WebKit Linux ≠ Safari macOS (voir le journal de tests.yml, point 5)."
          echo "$liste" | sed 's/^/  · /'
          {
            echo "## $essais essais NON JUGÉS ici ($specs specs)"
            echo ""
            echo "Glisser-déposer et mise en page du planificateur sous WebKit **Linux**, qui n'est pas le Safari de macOS. Ces specs restent jugées par \`npm run test:int\` sur macOS."
            echo "$liste" | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$essais" = "6" ] && [ "$specs" = "5" ] || { echo "::error::le nom de cette étape annonce 6 essais / 5 specs ; la liste en a $essais / $specs — mettre les deux d'accord, et le DIRE"; exit 1; }

      - name: Run integration tests (Playwright WebKit)
        working-directory: tests
        env:
          PW_EXCLURE_WEBKIT_LINUX: "1"
        run: npm run test:int

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: tests/test-results/
          retention-days: 7
