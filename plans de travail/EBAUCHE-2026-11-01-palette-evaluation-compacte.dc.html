<html lang="fr">

<x-dc>
<helmet>
<style>
body{margin:0}

<div style="width: 340px; height: 470px; box-sizing: border-box; padding: 12px; background: #4a6178; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif; color: #d6dee8;">
<div style="width: 316px; box-sizing: border-box; background: #1b2b3e; border: 1px solid #2c4058; border-radius: 12px; overflow: hidden; box-shadow: 0 6px 20px rgba(0,0,0,0.3);">

<div style="height: 36px; display: flex; align-items: center; justify-content: space-between; padding: 0 10px; border-bottom: 1px solid #2c4058;">
<div style="display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; letter-spacing: 1.5px; color: #c5d0dc;"><span style="color: #6f8399;">⠿</span><span>ÉVALUATION</span></div>
<div style="display: flex; align-items: center; gap: 6px;">
<button aria-label="Disposition horizontale" style="width: 22px; height: 22px; padding: 0; border: none; border-radius: 5px; background: transparent; color: #9fb1c4; font-family: inherit; font-size: 13px;">↔︎</button>
<button aria-label="Disposition verticale, avec les descriptions" style="width: 22px; height: 22px; padding: 0; border: none; border-radius: 5px; background: transparent; color: #9fb1c4; font-family: inherit; font-size: 13px;">↕︎</button>
<button aria-label="Disposition compacte" aria-pressed="true" style="width: 22px; height: 22px; padding: 0; border: none; border-radius: 5px; background: #3a5a7c; color: #ffffff; display: flex; align-items: center; justify-content: center;"><svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true" fill="currentColor"><rect x="1" y="1" width="6" height="6" rx="1"/><rect x="9" y="1" width="6" height="6" rx="1"/><rect x="1" y="9" width="6" height="6" rx="1"/><rect x="9" y="9" width="6" height="6" rx="1"/></svg></button>
<button aria-label="Replier" style="width: 22px; height: 22px; padding: 0; border: none; border-radius: 5px; background: transparent; color: #9fb1c4; font-family: inherit; font-size: 14px;">−</button>
</div>
</div>

<div style="padding: 8px; display: flex; flex-direction: column; gap: 6px;">

<div style="display: flex; flex-direction: column; border-radius: 8px; overflow: hidden; background: #2a3d52; gap: 1px;">
<div style="display: flex; align-items: center; gap: 8px; height: 46px; padding: 0 8px 0 10px; background: #15212e;">
<button aria-label="Structure, voir la description" style="flex: 1; min-width: 0; padding: 0; border: none; background: transparent; font-family: inherit; text-align: left; color: #ffffff; font-size: 14px;"><b style="text-decoration: underline dotted #6f8399; text-underline-offset: 3px;">Structure</b> <span style="font-size: 12px; font-weight: 400; color: #9fb1c4;">(20 %)</span></button>
<span style="width: 120px; height: 32px; flex: none; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; padding: 0 10px; border: 1px solid #36506b; border-radius: 7px; background: #1c2e42; font-size: 13px; color: #e3e9f0;"><span>--</span><span style="font-size: 11px; color: #9fb1c4;">⇅</span></span>
</div>
<div style="display: flex; align-items: center; gap: 8px; height: 46px; padding: 0 8px 0 10px; background: #15212e;">
<button aria-label="Rigueur, voir la description" style="flex: 1; min-width: 0; padding: 0; border: none; background: transparent; font-family: inherit; text-align: left; color: #ffffff; font-size: 14px;"><b style="text-decoration: underline dotted #6f8399; text-underline-offset: 3px;">Rigueur</b> <span style="font-size: 12px; font-weight: 400; color: #9fb1c4;">(20 %)</span></button>
<span style="width: 120px; height: 32px; flex: none; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; padding: 0 10px; border: 1px solid #36506b; border-radius: 7px; background: #1c2e42; font-size: 13px; color: #e3e9f0;"><span>--</span><span style="font-size: 11px; color: #9fb1c4;">⇅</span></span>
</div>
<div style="display: flex; align-items: center; gap: 8px; height: 46px; padding: 0 8px 0 10px; background: #15212e;">
<button aria-label="Plausibilité, voir la description" style="flex: 1; min-width: 0; padding: 0; border: none; background: transparent; font-family: inherit; text-align: left; color: #ffffff; font-size: 14px;"><b style="text-decoration: underline dotted #6f8399; text-underline-offset: 3px;">Plausibilité</b> <span style="font-size: 12px; font-weight: 400; color: #9fb1c4;">(15 %)</span></button>
<span style="width: 120px; height: 32px; flex: none; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; padding: 0 10px; border: 1px solid #36506b; border-radius: 7px; background: #1c2e42; font-size: 13px; color: #e3e9f0;"><span>--</span><span style="font-size: 11px; color: #9fb1c4;">⇅</span></span>
</div>
<div style="display: flex; align-items: center; gap: 8px; height: 46px; padding: 0 8px 0 10px; background: #15212e;">
<button aria-label="Nuance, voir la description" style="flex: 1; min-width: 0; padding: 0; border: none; background: transparent; font-family: inherit; text-align: left; color: #ffffff; font-size: 14px;"><b style="text-decoration: underline dotted #6f8399; text-underline-offset: 3px;">Nuance</b> <span style="font-size: 12px; font-weight: 400; color: #9fb1c4;">(25 %)</span></button>
<span style="width: 120px; height: 32px; flex: none; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; padding: 0 10px; border: 1px solid #36506b; border-radius: 7px; background: #1c2e42; font-size: 13px; color: #e3e9f0;"><span>--</span><span style="font-size: 11px; color: #9fb1c4;">⇅</span></span>
</div>
</div>

<div style="background: #15212e; border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 8px;">
<div style="display: flex; align-items: baseline; gap: 8px;"><button aria-label="Français écrit, voir la description" style="padding: 0; border: none; background: transparent; font-family: inherit; text-align: left; color: #ffffff; font-size: 14px;"><b style="text-decoration: underline dotted #6f8399; text-underline-offset: 3px;">Français écrit</b> <span style="font-size: 12px; font-weight: 400; color: #9fb1c4;">(20 %)</span></button><span style="font-size: 11px; font-weight: 700; letter-spacing: 1px; color: #e0b25c;">ALGORITHMIQUE</span></div>
<div style="display: flex; align-items: center; gap: 8px;">
<label style="flex: 1; display: flex; align-items: center; gap: 6px; font-size: 12px; color: #9fb1c4;">Erreurs<span style="flex: 1; height: 32px; box-sizing: border-box; display: flex; align-items: center; padding: 0 10px; border: 1px solid #36506b; border-radius: 7px; background: #1c2e42; font-size: 13px; color: #7f91a4;">0</span></label>
<label style="flex: 1; display: flex; align-items: center; gap: 6px; font-size: 12px; color: #9fb1c4;">Mots<span style="flex: 1; height: 32px; box-sizing: border-box; display: flex; align-items: center; padding: 0 10px; border: 1px solid #36506b; border-radius: 7px; background: #1c2e42; font-size: 13px; color: #7f91a4;"></span></label>
</div>
<p style="margin: 0; font-size: 12.5px; color: #d6dee8;">-- erreurs sur -- mots → --/20 (-- %)</p>
<span aria-label="Niveau de performance" style="height: 32px; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; padding: 0 10px; border: 1px solid #36506b; border-radius: 7px; background: #1c2e42; font-size: 13px; color: #e3e9f0;"><span>— Utiliser le niveau calculé —</span><span style="font-size: 11px; color: #9fb1c4;">⇅</span></span>
</div>

</div>
</div>
</div>
