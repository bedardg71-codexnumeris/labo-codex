<helmet>
<style>

<div style="width: 212px; height: 210px; box-sizing: border-box; padding: 12px; background: #4a6178; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif; color: #d6dee8;">
<div style="width: 188px; box-sizing: border-box; background: #1b2b3e; border: 1px solid #2c4058; border-radius: 12px; overflow: hidden; box-shadow: 0 6px 20px rgba(0,0,0,0.3);">

<div style="height: 30px; display: flex; align-items: center; justify-content: space-between; padding: 0 6px; border-bottom: 1px solid #2c4058;">
<div style="display: flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; letter-spacing: 1px; color: #c5d0dc;"><span style="color: #6f8399;">⠿</span><span>CODES</span><span title="12 erreurs" style="font-size: 10.5px; letter-spacing: 0; padding: 1px 6px; border-radius: 8px; background: #2f4762; color: #e3e9f0;">12</span><svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true" fill="none" stroke="#c5d0dc" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2.5 V5.5 M12 18.5 V21.5 M2.5 12 H5.5 M18.5 12 H21.5 M5.3 5.3 L7.4 7.4 M16.6 16.6 L18.7 18.7 M5.3 18.7 L7.4 16.6 M16.6 7.4 L18.7 5.3"/><circle cx="12" cy="12" r="6.5"/></svg></div>
<div style="display: flex; align-items: center; gap: 4px;">
<button aria-label="Disposition horizontale" style="width: 18px; height: 18px; padding: 0; border: none; border-radius: 4px; background: transparent; color: #9fb1c4; font-family: inherit; font-size: 12px;">↔︎</button>
<button aria-label="Disposition verticale, avec les descriptions" style="width: 18px; height: 18px; padding: 0; border: none; border-radius: 4px; background: transparent; color: #9fb1c4; font-family: inherit; font-size: 12px;">↕︎</button>
<button aria-label="Disposition compacte" aria-pressed="true" style="width: 18px; height: 18px; padding: 0; border: none; border-radius: 4px; background: #3a5a7c; color: #ffffff; display: flex; align-items: center; justify-content: center;"><svg viewBox="0 0 16 16" width="11" height="11" aria-hidden="true" fill="currentColor"><rect x="1" y="1" width="6" height="6" rx="1"/><rect x="9" y="1" width="6" height="6" rx="1"/><rect x="1" y="9" width="6" height="6" rx="1"/><rect x="9" y="9" width="6" height="6" rx="1"/></svg></button>
<button aria-label="Replier" style="width: 18px; height: 18px; padding: 0; border: none; border-radius: 4px; background: transparent; color: #9fb1c4; font-family: inherit; font-size: 13px;">−</button>
</div>
</div>

<div style="padding: 8px;">
<div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 1px; border-radius: 8px; overflow: hidden; background: #0f1b28;">
<button aria-label="Code 1, Construction syntaxique ou accord du verbe, 3 posés" style="position: relative; height: 34px; padding: 0; border: none; background: #c0392b; color: #ffffff; font-family: inherit; font-size: 15px; font-weight: 700;">1<span style="position: absolute; top: 2px; right: 2px; font-size: 9.5px; line-height: 13px; padding: 0 3px; border-radius: 6px; background: rgba(8,16,26,0.78); color: #ffffff;">3</span></button>
<button aria-label="Code 2, Subordonnée seule" style="position: relative; height: 34px; padding: 0; border: none; background: #c0392b; color: #ffffff; font-family: inherit; font-size: 15px; font-weight: 700;">2</button>
<button aria-label="Code 3, Ponctuation, 5 posés" style="position: relative; height: 34px; padding: 0; border: none; background: #c9551f; color: #ffffff; font-family: inherit; font-size: 15px; font-weight: 700;">3<span style="position: absolute; top: 2px; right: 2px; font-size: 9.5px; line-height: 13px; padding: 0 3px; border-radius: 6px; background: rgba(8,16,26,0.78); color: #ffffff;">5</span></button>
<button aria-label="Code 4, Groupe du nom" style="position: relative; height: 34px; padding: 0; border: none; background: #2f6fc4; color: #ffffff; font-family: inherit; font-size: 15px; font-weight: 700;">4</button>
<button aria-label="Code 5, Pronom, accord du pronom ou lien avec son antécédent, 2 posés" aria-pressed="true" style="position: relative; height: 34px; padding: 0; border: none; background: #2f6fc4; color: #ffffff; font-family: inherit; font-size: 15px; font-weight: 700; box-shadow: inset 0 0 0 2px #ffffff, inset 0 0 0 4px #0d1826;">5<span style="position: absolute; top: 5px; right: 5px; font-size: 9.5px; line-height: 13px; padding: 0 3px; border-radius: 6px; background: rgba(8,16,26,0.78); color: #ffffff;">2</span></button>
<button aria-label="Code 6, Accord du participe passé" style="position: relative; height: 34px; padding: 0; border: none; background: #2f6fc4; color: #ffffff; font-family: inherit; font-size: 15px; font-weight: 700;">6</button>
<button aria-label="Code 7, Mot invariable (préposition, adverbe, conjonction)" style="position: relative; height: 34px; padding: 0; border: none; background: #7b2fb0; color: #ffffff; font-family: inherit; font-size: 15px; font-weight: 700;">7</button>
<button aria-label="Code 8, Déterminant" style="position: relative; height: 34px; padding: 0; border: none; background: #7b2fb0; color: #ffffff; font-family: inherit; font-size: 15px; font-weight: 700;">8</button>
<button aria-label="Code 9, Vocabulaire, 1 posé" style="position: relative; height: 34px; padding: 0; border: none; background: #2f7d32; color: #ffffff; font-family: inherit; font-size: 15px; font-weight: 700;">9<span style="position: absolute; top: 2px; right: 2px; font-size: 9.5px; line-height: 13px; padding: 0 3px; border-radius: 6px; background: rgba(8,16,26,0.78); color: #ffffff;">1</span></button>
<button aria-label="Code 10, Orthographe d'usage ou éléments de typographie, 1 posé" style="position: relative; height: 34px; padding: 0; border: none; background: #2f7d32; color: #ffffff; font-family: inherit; font-size: 14px; font-weight: 700;">10<span style="position: absolute; top: 2px; right: 2px; font-size: 9.5px; line-height: 13px; padding: 0 3px; border-radius: 6px; background: rgba(8,16,26,0.78); color: #ffffff;">1</span></button>
</div>

<p style="margin: 8px 2px 0; min-height: 51px; font-size: 12px; line-height: 17px; color: #e3e9f0;"><strong style="color: #ffffff;">5.</strong> Pronom, accord du pronom ou lien avec son antécédent</p>
</div>
