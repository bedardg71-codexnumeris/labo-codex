# Configuration Netlify — Labo Codex
# Source unique versionnée. Documentation : DEPLOY.md
#
# Consolide l'ancien fichier `_headers` (à retirer après validation du deploy).
# Pas d'env vars sensibles ici — toute configuration sensible reste dans le
# dashboard Netlify.

[build]
  # 16 oct. 2026 : seule la liste blanche des fichiers de l'application est
  # publiée (scripts/construire-publication.mjs). Avant, `publish = "."` mettait
  # en ligne tout l'arbre, documents de travail compris, dans chaque déploiement.
  command = "node scripts/construire-publication.mjs"
  publish = "publication"

# ============================================================================
# Redirections de domaine — fermer les portes de service (1er sept. 2026)
#
# L'application est servie à plusieurs adresses. Seule `app.codexnumeris.org`
# passe par Cloudflare Access ; les sous-domaines `*.netlify.app` servaient la
# MÊME application, complète, sans aucune authentification (mesuré le 1er sept.
# 2026 : 200 sur les deux, `etag` identique à la production).
#
# Ce n'est PAS une fuite de données — l'application est locale d'abord, un
# visiteur par cette porte n'obtient qu'un espace vide, le sien. Le défaut est
# que Netlify compte ces visiteurs et qu'Access ne les voit jamais : le nombre
# d'utilisateurs affiché ne veut rien dire, et ces gens-là n'entrent dans
# aucune liste de contacts.
#
# ⚠ `force = true` est INDISPENSABLE : sans lui, Netlify sert le fichier
# statique existant (`/index.html`) au lieu de rediriger.
#
# ⚠ Les aperçus de PR (`deploy-preview-<N>--codexnumeris-051225.netlify.app`)
# ne sont VOLONTAIREMENT pas redirigés : ils servent à éprouver un chantier sur
# iPad avant la fusion, et une redirection les rendrait inutilisables.
#
# ⚠ Deux hôtes NOMMÉS suffisent : les déploiements de branche sont désactivés,
# mesuré le 1er sept. 2026 (une branche réelle rend 404, comme un témoin
# inventé ; seul `main--…` rendait 200, parce que `main` est la production).
# Si on les activait un jour, `from` n'accepte PAS de joker sur l'hôte : ça se
# réglerait dans le tableau de bord Netlify, pas ici. Détail dans DEPLOY.md §1.2.
#
# ⚠ Le 301 est PERMANENT et retenu durablement par les navigateurs (Safari en
# particulier). Rouvrir une de ces adresses coûtera plus que de retirer ces
# lignes : les navigateurs qui l'ont apprise redirigeront d'eux-mêmes.
# ============================================================================

[[redirects]]
  from = "https://codexnumeris-051225.netlify.app/*"
  to = "https://app.codexnumeris.org/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://main--codexnumeris-051225.netlify.app/*"
  to = "https://app.codexnumeris.org/:splat"
  status = 301
  force = true

# ============================================================================
# Headers de cache — évite que les navigateurs (Safari iPad en particulier)
# servent des versions périmées après un déploiement.
#
# #825 (11 septembre 2026) — `/js/*` et `/css/*` deviennent IMMUABLES UN AN. Mesuré par Grégoire dans Chrome (Network, 7 h 17-7 h 20) :
# une ouverture de l'application revalidait 199 scripts et 2 feuilles de style,
# un aller-retour chacun derrière Cloudflare Access — 34 à 51 s de Load — alors
# qu'un rechargement simple servait tout du cache en 0,92 s. « max-age=0,
# must-revalidate » sur `/js/*` demandait au navigateur de redemander, à chaque
# ouverture, deux cents fichiers qui n'avaient pas changé.
#
# L'INVARIANT QUI REND « immutable » SÛR : UNE URL NE SERT JAMAIS DEUX CONTENUS.
# Il tient par trois filets, tous versionnés :
#   1. le garde pre-commit #547 (`scripts/verifier-anticache-stage.mjs`) refuse
#      tout commit où un fichier stagé garde le `?v=` qu'il avait à HEAD ;
#   2. `scripts/release.mjs` (`fichiersModifies`) bumpe le jeton de TOUT `js/`
#      ou `.css` modifié depuis la release précédente, arbre de travail compris ;
#   3. la sentinelle #825 (`tests/unit/sentinelle-825-ouverture-immuable.test.js`)
#      refuse une référence sans `?v=` — dans `index.html` comme dans les deux
#      chargements dynamiques (`pack-demo-10.js`, `heic-worker.js`, jeton = build)
#      — et refuse, au pre-push, que ces deux fichiers-là changent sans release
#      (leur jeton est le build : sans release, même URL, contenu neuf).
# Un fichier modifié change donc d'URL ; l'ancienne peut rester en cache un an,
# plus personne ne la demande.
#
# POURQUOI `/styles.css` N'EST PAS IMMUABLE (relecture adverse du 11 sept.) :
# `design-system.html` et les 17 modules de « Design system - Modules » sont
# SERVIS (publish = ".") et chargent `styles.css` SANS jeton — et rien ne les
# bumpe à la release. Immuable, la référence d'interface afficherait l'ancienne
# feuille un an après chaque correctif CSS. Une requête revalidée sur deux
# cents : le coût est nul, on la garde. L'application, elle, charge
# `styles.css?v=…` (index.html l. 14) — URL distincte, jeton bumpé par release.mjs.
#
# POURQUOI `index.html` ET `/` RESTENT À ZÉRO : c'est le document qui PORTE les
# jetons. S'il était immuable, un navigateur garderait un an l'ancienne liste
# d'URL — et l'ancienne application avec. C'est le seul raté irréversible de ce
# lot (un `index.html` figé ne se rattrape plus chez qui l'a reçu) ; la
# sentinelle #825 refuse `immutable` sur `/*.html`. `version.json` reste
# `no-store` : la détection de mise à jour (`init-inline.js`) et la sonde de
# rechargement (`rechargement-sur.js`) en dépendent. `libs/` n'a aucune règle et
# aucun jeton pour quatre bibliothèques : elles restent revalidées, quatre
# requêtes, pas deux cents — hors périmètre, volontairement.
# ============================================================================

# HTML : toujours revalider (porte d'entrée de l'app)
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# JavaScript : immuable un an — chaque URL porte un `?v=` qui change avec le
# contenu (#825, invariant ci-dessus). Avant : max-age=0, must-revalidate.
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Feuilles de style : idem
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# styles.css : revalidée — chargée SANS jeton par design-system.html et ses
# modules (voir le bloc ci-dessus). ⛔ Ne pas la rendre immuable.
[[headers]]
  for = "/styles.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Source de vérité de la version : jamais cacher
[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Données de configuration JSON : revalider
[[headers]]
  for = "/*.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Icônes SVG : peuvent être cachées (changent rarement, noms stables)
[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# Images (non-icônes) : cache modéré
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"
